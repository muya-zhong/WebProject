<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>黄梅戏体验活动报名</title>
    <link rel="stylesheet" href="styles.css">
    <script src="practice.js" defer></script>
  </head>
  <body>
    <h1>黄梅戏体验活动报名</h1>
    <p>仅使用虚构信息练习，不发送或保存个人数据。</p>
    <nav><a href="index.html">演出筛选</a> · <a href="debug.html">表单排错</a> · <a href="signup.html">活动报名</a> · <a href="report.html">实验报告</a></nav>
    <p class="task-hint">T5：在 BEGIN SIGNUP 区域完成姓名、邮箱、活动选择和操作按钮；字段名称自行设计。</p>
    <form>
      <!-- BEGIN SIGNUP -->
      <!-- TODO：根据任务书完成报名表；无需编写脚本。 -->
     <fieldset>
        <legend>活动报名表</legend>

        <label for="username">姓名</label>
        <input id="username" type="text" name="username" required>

        <label for="useremail">邮箱</label>
        <input id="useremail" type="email" name="useremail" required>

        <p>选择参与的活动：</p>
        <input type="radio" id="act1" name="activity" value="changqiang" required>
        <label for="act1">唱腔体验</label>

        <input type="radio" id="act2" name="activity" value="xifu">
        <label for="act2">戏服赏析</label>

        <input type="radio" id="act3" name="activity" value="lianpu">
        <label for="act3">脸谱绘制</label>
      </fieldset>
      <button type="submit">检查</button>
      <button type="reset">重置</button>
      <!-- END SIGNUP -->
    </form>
    <p id="feedback" aria-live="polite">尚未检查输入。</p>
  </body>
</html>
