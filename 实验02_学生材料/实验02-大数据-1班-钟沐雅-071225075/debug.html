<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>列表结构纠错</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <h1>请修复两处列表结构错误</h1>
    <h2>准备材料</h2>
    <ul>
      <li>《天仙配》欣赏要点</li>
      <!-- <ul>直接子元素只能是<li>,不能直接写另一个<ul> -->
        <ul>
          <li>人物关系</li>
        </ul>
    </ul>
    <h2>术语</h2>
    <dl>
      <dt>唱腔</dt>
      <dd>戏曲演唱的曲调表达</dd>
      <!-- <dt>表示术语，名词，<dd>表示解释，二者平级 -->
    </dl>
  </body>
</html>
