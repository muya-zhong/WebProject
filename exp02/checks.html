<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>空白与编号验证</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <h1>空白与编号验证</h1>
    <h2>普通段落</h2>
    <p>剧目    类型
天仙配    黄梅戏</p>
    <h2>预格式化</h2>

天仙配    黄梅戏</pre>
    <h2>有序列表编号</h2>
    <ol start="3">
      <li>查阅资料</li>
      <li value="7">理解情境</li>
      <li>观察表达</li>
      <li>记录感受</li>
    </ol>
    <!-- 先预测再观察；只将value改成5再观察，最终恢复7。 -->
  </body>
</html>
